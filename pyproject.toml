[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tool-to-agent-retrieval-mcp"
version = "0.1.1"
description = "MCP server that selects the best-suited downstream agent for a natural language query, distributed via uvx."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Gustavo Cayres" }]
keywords = ["mcp", "model-context-protocol", "agent", "retrieval", "llm", "uvx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = ["mcp>=1.0"]

[project.urls]
Homepage = "https://github.com/GusCayresMindsight/tool-to-agent-retrieval-mcp"
Repository = "https://github.com/GusCayresMindsight/tool-to-agent-retrieval-mcp"
Issues = "https://github.com/GusCayresMindsight/tool-to-agent-retrieval-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-bdd>=7",
    "pytest-cov>=6",
    "ruff>=0.15.14",
]

[project.scripts]
tool-to-agent-retrieval-mcp = "tool_selector_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tool_selector_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests/pytest"]
bdd_features_base_dir = "docs/features"

[tool.coverage.run]
source = ["src/tool_selector_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    "E501",  # line too long — ruff format handles line breaks
]
